<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jev Meal Classifier</title>
<style>
  :root {
    --bg: #f6f6f3; --card: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #e4e4de;
    --bar-bg: #ecece6; --bar: #9a9a92; --top: #2f7d4f; --chip: #f0f0ea; --new: #fff1c2;
    --done: #2f7d4f; --err: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151514; --card: #1f1f1d; --text: #ecece8; --muted: #9b9b94; --line: #33332f;
      --bar-bg: #2c2c29; --bar: #6d6d66; --top: #5fbf85; --chip: #2a2a27; --new: #4a3f17;
      --done: #5fbf85; --err: #f2867d;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header { padding: 24px 16px 8px; max-width: 1200px; margin: 0 auto; }
  h1 { margin: 0; font-size: 22px; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
  main {
    display: grid; gap: 16px; padding: 16px; max-width: 1200px; margin: 0 auto;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr));
  }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .order { font-weight: 600; font-variant-numeric: tabular-nums; }
  .meta { color: var(--muted); font-size: 12px; }
  .badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 99px;
           border: 1px solid var(--done); color: var(--done); }
  .pred { margin: 12px 0 10px; }
  .pred .meal { font-size: 19px; font-weight: 600; }
  .pred .p { color: var(--top); font-weight: 600; font-variant-numeric: tabular-nums; }
  .bars { display: grid; gap: 5px; }
  .row { display: grid; grid-template-columns: 9.5em 1fr 3em; align-items: center; gap: 8px; font-size: 12px; }
  .row .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
  .row.top .name { color: var(--text); font-weight: 600; }
  .track { height: 8px; background: var(--bar-bg); border-radius: 4px; overflow: hidden; }
  .fill { height: 100%; background: var(--bar); border-radius: 4px; transition: width .4s; }
  .row.top .fill { background: var(--top); }
  .row .num { text-align: right; font-variant-numeric: tabular-nums; }
  h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 14px 0 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip { background: var(--chip); border-radius: 6px; padding: 2px 7px; font-size: 12px; }
  .chip.new { background: var(--new); }
  .history { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 10px; }
  .history b { color: var(--text); font-weight: 600; }
  .err { color: var(--err); font-size: 12px; margin-top: 8px; }
  .empty { color: var(--muted); padding: 40px 16px; text-align: center; grid-column: 1 / -1; }
</style>
</head>
<body>
<header>
  <h1>Jev Meal Classifier</h1>
  <div class="sub" id="status">Waiting for cart updates from Estuary…</div>
</header>
<main id="orders"><div class="empty">No cart updates yet.</div></main>

<script>
const pct = p => p == null ? "–" : Math.round(p * 100) + "%";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));

function card(o) {
  if (!o.probabilities) {
    return `<div class="card"><div class="order">${esc(o.order_id)}</div><div class="err">${esc(o.error)}</div></div>`;
  }
  const added = new Set((o.added || []).map(i => i.name));
  const bars = Object.entries(o.probabilities).map(([meal, p]) => `
    <div class="row ${meal === o.meal ? "top" : ""}">
      <span class="name" title="${esc(meal)}">${esc(meal)}</span>
      <span class="track"><span class="fill" style="display:block;width:${(p * 100).toFixed(1)}%"></span></span>
      <span class="num">${pct(p)}</span>
    </div>`).join("");
  const chips = o.ingredients.map(i =>
    `<span class="chip ${added.has(i.name) ? "new" : ""}" title="${esc(i.qty)} ${esc(i.unit)} · ${esc(i.category)}">${esc(i.name)}</span>`).join("");
  const history = o.history.map(h => `<span>#${h.update_seq} <b>${esc(h.meal)}</b> ${pct(h.probability)}</span>`).join("");
  return `<div class="card">
    <div class="head">
      <span class="order">${esc(o.order_id)}</span>
      ${o.is_complete ? '<span class="badge">COMPLETE</span>' : ""}
    </div>
    <div class="meta">customer ${esc(o.customer_id)} · update #${esc(o.update_seq)} · ${o.ingredients.length} items</div>
    <div class="pred"><span class="meal">${esc(o.meal)}</span> <span class="p">${pct(o.probability)}</span></div>
    <div class="bars">${bars}</div>
    <h3>Cart <span style="text-transform:none;letter-spacing:0">(highlighted = just added)</span></h3>
    <div class="chips">${chips}</div>
    <h3>Prediction by update</h3>
    <div class="history">${history}</div>
    ${o.error ? `<div class="err">Last Jev call failed: ${esc(o.error)}</div>` : ""}
  </div>`;
}

async function refresh() {
  try {
    const r = await fetch("api/orders", {cache: "no-store"});
    const data = await r.json();
    document.getElementById("status").textContent =
      `${data.orders.length} orders · ${data.backlog} updates waiting for Jev · refreshed ${new Date().toLocaleTimeString()}`;
    if (data.orders.length) document.getElementById("orders").innerHTML = data.orders.map(card).join("");
  } catch (e) {
    document.getElementById("status").textContent = "Can't reach the app: " + e;
  }
}
refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
