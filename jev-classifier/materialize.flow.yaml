# CLI alternative to creating the materialization in the Estuary UI:
#   flowctl catalog publish --source materialize.flow.yaml
materializations:
  YOUR_PREFIX/jev-classifier:
    endpoint:
      connector:
        image: ghcr.io/estuary/materialize-webhook:v1
        config:
          # The classifier's ngrok URL. Must end with a trailing '/'.
          address: https://YOUR-NGROK-SUBDOMAIN.ngrok-free.app/
          headers:
            customHeaders:
              - name: x-webhook-secret
                value: CHANGE_ME   # must equal WEBHOOK_SECRET in .env
    bindings:
      # The collection created by the jev-app Postgres capture.
      - source: YOUR_PREFIX/cart_updates
        resource:
          relativePath: webhook/estuary
